<!doctype html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d2a"><title>Elena Ainsworth's Study Diary</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<header class="mast"><button id="menuBtn" class="square-btn" aria-label="Open index">☰</button><div class="brand"><small>HOGWARTS · A STUDENT'S DESK</small><strong>Elena Ainsworth's Study Diary</strong></div><span class="fill"></span><button id="pointsBtn" class="header-pill">✧ <span id="pointCount">0</span> pts</button><button id="mailBtn" class="header-pill">✉ <span id="mailCount">0</span></button><button id="settingsBtn" class="square-btn" aria-label="Settings">⚙</button></header>
<div class="appbody">
<aside id="side"><div class="side-header">INDEX OF CONTENTS <button id="closeSide">×</button></div><input id="find" placeholder="Find a page or subject…" aria-label="Search"/><div id="navItems"></div><div class="side-foot"><span id="houseCaption">Your study diary</span><button id="backupShortcut" class="outline-btn">⇩ Backup</button></div></aside>
<main id="main"><div class="ambient"></div><div id="workspace"></div></main>
</div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="taskModal"><form id="taskForm" method="dialog"><h2>Add a study task</h2><label>Task / lesson<input id="taskTitle" maxlength="180" required placeholder="Arithmancy — Lesson 4"></label><div class="twocol"><label>Subject<select id="taskSubject"><option>Arithmancy</option><option>Magical Literature</option><option>Magical Linguistics</option><option>Foreign Magical Language</option><option>Wizarding Ethics</option><option>Philosophy of Magic</option><option>History of Magic</option><option>Potions</option><option>Charms</option><option>Other</option></select></label><label>Difficulty<select id="taskDifficulty"><option value="3">Easy · 3 points</option><option value="5" selected>Normal · 5 points</option><option value="8">Difficult · 8 points</option></select></label></div><label class="checkbox-label"><input type="checkbox" id="taskImportant"> Important · +2 points</label><footer><button type="button" id="cancelTask">Cancel</button><button class="primary">Add task</button></footer></form></dialog>
<dialog id="pageModal"><form id="pageForm" method="dialog"><h2>A Fresh Sheet of Parchment</h2><label>Page type<select id="pageKind"></select></label><label>Title<input id="pageTitle" required maxlength="120"></label><label>Date<input id="pageDate" type="date"></label><footer><button type="button" id="cancelPage">Cancel</button><button class="primary">Create Page</button></footer></form></dialog>
<dialog id="settingsModal"><h2>Student's Preferences</h2><label>Your name<input id="studentName"></label><label>House<select id="houseSelect"><option>Slytherin</option><option>Gryffindor</option><option>Ravenclaw</option><option>Hufflepuff</option></select></label><label>Simulation mode<select id="simMode"><option value="hybrid">Hybrid — study and simulated life</option><option value="companion">Companion — quiet</option><option value="simulation">Simulation — more events</option></select></label><label class="checkbox-label"><input type="checkbox" id="friendsAllowed"> Allow fictional friends' notes</label><label class="checkbox-label"><input type="checkbox" id="reducedMotion"> Reduce motion</label><p class="muted">Stored privately on this device. Back up your notes before uninstalling. Character messages are simulated, not real messages.</p><footer><button id="exportBtn">Export JSON</button><button id="importBtn">Restore JSON</button><button id="savePrefs" class="primary">Save</button><button id="cancelPrefs">Close</button></footer><input type="file" id="fileInput" accept=".json,application/json" hidden></dialog>
</div><script src="app.js"></script></body></html>
